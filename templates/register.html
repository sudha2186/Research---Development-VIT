{% extends "base.html" %}
{% set active = 'register' %}
{% block title %}Register - VIT Research Portal{% endblock %}
{% block content %}
<h1>📝 Create an Account</h1>
<p style="color:#555; margin-bottom:1.5rem;">Register using your VIT email address (@vit.edu.in).</p>

<div class="profile-card" style="max-width:440px; margin:0 auto; display:block;">
    <form method="POST" action="{{ url_for('auth.register') }}">
        <div style="margin-bottom:1rem;">
            <label style="display:block; margin-bottom:6px; font-weight:600; color:#333;">Full Name *</label>
            <input type="text" name="name" required placeholder="Dr. Jane Doe"
                   style="width:100%; padding:10px 14px; border:2px solid #ccd; border-radius:8px; font-size:1rem;">
        </div>
        <div style="margin-bottom:1rem;">
            <label style="display:block; margin-bottom:6px; font-weight:600; color:#333;">VIT Email *</label>
            <input type="email" name="email" required placeholder="yourname@vit.edu.in"
                   style="width:100%; padding:10px 14px; border:2px solid #ccd; border-radius:8px; font-size:1rem;">
        </div>
        <div style="margin-bottom:1rem;">
            <label style="display:block; margin-bottom:6px; font-weight:600; color:#333;">Role *</label>
            <select name="role" id="roleSelect" onchange="toggleDept()" required
                    style="width:100%; padding:10px 14px; border:2px solid #ccd; border-radius:8px; font-size:1rem;">
                <option value="student">Student</option>
                <option value="faculty">Faculty</option>
            </select>
        </div>
        <div id="deptGroup" style="margin-bottom:1rem; display:none;">
            <label style="display:block; margin-bottom:6px; font-weight:600; color:#333;">Department *</label>
            <select name="department" id="deptSelect"
                    style="width:100%; padding:10px 14px; border:2px solid #ccd; border-radius:8px; font-size:1rem;">
                {% for d in departments %}
                <option value="{{ d }}">{{ d }}</option>
                {% endfor %}
            </select>
        </div>
        <div style="margin-bottom:1rem;">
            <label style="display:block; margin-bottom:6px; font-weight:600; color:#333;">Password *</label>
            <input type="password" name="password" required placeholder="••••••••"
                   style="width:100%; padding:10px 14px; border:2px solid #ccd; border-radius:8px; font-size:1rem;">
        </div>
        <div style="margin-bottom:1.5rem;">
            <label style="display:block; margin-bottom:6px; font-weight:600; color:#333;">Confirm Password *</label>
            <input type="password" name="confirm_password" required placeholder="••••••••"
                   style="width:100%; padding:10px 14px; border:2px solid #ccd; border-radius:8px; font-size:1rem;">
        </div>
        <button type="submit" class="btn" style="width:100%;">Register</button>
    </form>
</div>

<div style="max-width:440px; margin:1.5rem auto 0; font-size:0.9rem; color:#666; text-align:center;">
    Already have an account? <a href="{{ url_for('auth.login') }}" style="color:#004080; font-weight:600;">Log in</a>
</div>

<script>
function toggleDept() {
    const role = document.getElementById('roleSelect').value;
    const deptGroup = document.getElementById('deptGroup');
    deptGroup.style.display = role === 'faculty' ? 'block' : 'none';
}
toggleDept();
</script>
{% endblock %}
